<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      width: 260px;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <h2>⏰ Timer Alert</h2>

  <button id="testBtn">Test Alarm Sound</button>

  <script src="popup.js"></script>
</body>
</html>
